# Local M0 only. Run scripts/m0-runtime.ps1; credentials are generated in .local.
name: timeline-m0
services:
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${M0_SQL_PASSWORD:?Run m0-runtime.ps1 first}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  create-database:
    image: mcr.microsoft.com/mssql/server@sha256:b1395aa51b4ec39981883560f1379ea9eba2a1c0719bf8e6477902769316bb79
    environment:
      SQLCMDPASSWORD: ${M0_SQL_PASSWORD:?Run m0-runtime.ps1 first}
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command: ['-S', sql, '-U', sa, '-C', '-b', '-Q', "IF DB_ID('timeline_m0') IS NULL CREATE DATABASE [timeline_m0]"]
    depends_on:
      sql: {condition: service_healthy}
  identity:
    image: sensenetcsp/sn-identityserver@sha256:34e610bd4d6d26b803b3140ac518908ea5e8b2bf42ed5cd283429eaee7d7f7be
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:443;http://+:80
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${M0_CERT_PASSWORD:?Run m0-runtime.ps1 first}
      IdentityServer__IssuerUri: https://localhost:41017
      sensenet__authentication__setDefaultClients: true
      sensenet__Clients__spa__RepositoryHosts__0__PublicHost: https://localhost:41016
      sensenet__Clients__spa__RepositoryHosts__0__InternalHost: http://repository
      sensenet__Clients__client__RepositoryHosts__0__PublicHost: https://localhost:41016
      sensenet__Clients__client__RepositoryHosts__0__InternalHost: http://repository
      sensenet__Clients__adminui__RepositoryHosts__0__PublicHost: https://localhost:41016
      sensenet__Clients__adminui__RepositoryHosts__0__InternalHost: http://repository
    ports: ['127.0.0.1:41017:443']
    volumes: ['./.local/certificates:/https:ro', 'identity-data:/root/.aspnet']
    restart: unless-stopped
  repository:
    image: sensenetcsp/sn-api-sql@sha256:45cbdf96a3663c3f9c84dfa1b113c00ca45225b7f1b075a6d2e5622b1ece97b3
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:443;http://+:80
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${M0_CERT_PASSWORD:?Run m0-runtime.ps1 first}
      ConnectionStrings__SnCrMsSql: 'Persist Security Info=False;Initial Catalog=timeline_m0;Data Source=sql;User ID=sa;Password=${M0_SQL_PASSWORD};TrustServerCertificate=true'
      sensenet__authentication__authServerType: IdentityServer
      sensenet__authentication__authority: https://localhost:41017
      sensenet__authentication__metadatahost: http://identity
      sensenet__authentication__repositoryUrl: https://localhost:41016
      sensenet__authentication__AddJwtCookie: false
      sensenet__identityManagement__UserProfilesEnabled: false
      sensenet__apikeys__healthcheckeruser: ${M0_HEALTH_APIKEY:?Run m0-runtime.ps1 first}
      sensenet__cors__AllowedOrigins__0: https://localhost:8080
    ports: ['127.0.0.1:41016:443']
    volumes: ['./.local/certificates:/https:ro', 'repository-data:/app/App_Data', './.local/extensions/Timeline.Theories.M0.Security.dll:/app/Timeline.Theories.M0.Security.dll:ro']
    depends_on:
      create-database: {condition: service_completed_successfully}
      identity: {condition: service_started}
    restart: unless-stopped
volumes:
  sql-data: {}
  repository-data: {}
  identity-data: {}
